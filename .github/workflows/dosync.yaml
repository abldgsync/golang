name: Do Tools Sync For Abldg

# 共享同步逻辑位于私有仓库 shared_actions/sync_golang.yaml(组合 action)
# 请将下方 OWNER 替换为你的 GitHub 组织/用户名
on:
  workflow_dispatch:
    inputs:
      binvern:
        description: '指定 Golang 版本号(如 1.25.0 或 go1.25.0,不填则使用最新稳定版)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: full-sync
  cancel-in-progress: false

jobs:
  sync_binaries:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 同步 Golang 二进制
        uses: abldgsync/shared_actions/sync_golang.yaml@v1
        with:
          binvern: ${{ inputs.binvern }}
