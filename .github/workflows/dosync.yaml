name: Do Tools Sync For Abldg

# 共享同步逻辑位于公共(Public)仓库 shared_actions/sync_golang.yaml(组合 action,已钉 commit SHA)
on:
  # schedule:
  #   - cron: '10 4 12 * *'  # 已屏蔽,不再定时执行
  workflow_dispatch:
    inputs:
      binvern:
        description: '指定 Golang 版本号(如 1.25.0 或 go1.25.0,不填则使用最新稳定版)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: full-sync
  cancel-in-progress: false

jobs:
  sync_binaries:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 同步 Golang 二进制
        uses: abldgsync/shared_actions/sync_golang@main
        with:
          binvern: ${{ inputs.binvern }}
