name: Sync Golang Binaries

# 共享同步逻辑位于公共(Public)仓库 abldgsync/.github/sync(单一组合 action,通过 with.tool 选择工具)
#(当前引用 @main,建议钉成具体 commit SHA 以获得可复现构建)
on:
  # schedule:
  #   - cron: '10 4 12 * *'  # 已屏蔽,不再定时执行
  workflow_dispatch:
    inputs:
      binvern:
        description: '指定 Golang 版本号(如 1.25.0 或 go1.25.0,不填则使用最新稳定版)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: full-sync
  cancel-in-progress: false

jobs:
  sync_binaries:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 同步 Golang 二进制
        uses: abldgsync/.github/sync@main
        with:
          tool: golang
          binvern: ${{ inputs.binvern }}
