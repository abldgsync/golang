name: Do Tools Sync For Abldg

# 共享同步逻辑位于私有仓库 shared_actions/sync_golang.yaml(组合 action,已钉 commit SHA 对应 v1)
on:
  # schedule:
  #   - cron: '10 4 12 * *'  # 已屏蔽,不再定时执行
  workflow_dispatch:
    inputs:
      binvern:
        description: '指定 Golang 版本号(如 1.25.0 或 go1.25.0,不填则使用最新稳定版)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: full-sync
  cancel-in-progress: false

jobs:
  sync_binaries:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 检出私有共享动作
        uses: actions/checkout@v7
        with:
          repository: abldgsync/shared_actions
          ref: 1bd39c681fe95f4ad9c07c7bf3f54d0d3cd94680
          token: ${{ secrets.SYNC_PAT }}   # 需有读取 shared_actions 权限的 PAT(建议设为组织级 Secret)
          path: shared_actions
      - name: 同步 Golang 二进制
        uses: ./shared_actions/sync_golang.yaml  # 本地路径:从私有库检出后引用,仓库保持私有
        with:
          binvern: ${{ inputs.binvern }}
